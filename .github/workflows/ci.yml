name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  strict:
    name: Swift 6 mode, warnings as errors
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # The package declares swiftLanguageModes: [.v6, .v5], so this compiles under the Swift 6
      # language mode. Promoting warnings to errors keeps concurrency regressions from landing
      # as "just a warning" and quietly accumulating.
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Build tests (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

  platforms:
    name: Build for ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS Simulator, visionOS Simulator]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme WaveformKit

      # This matters more than it looks: the audio-session code lives inside
      # `#if os(iOS) || os(visionOS)`, so a macOS `swift build` never compiles it. Concurrency
      # errors in that code are only visible here.
      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild \
            -scheme WaveformKit \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

  docs:
    name: Build documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Catches broken DocC symbol links in the catalog before they reach the published docs
      # on Swift Package Index.
      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -scheme WaveformKit \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee docbuild.log
          if grep -q "warning:.*doesn't exist at" docbuild.log; then
            echo "::error::DocC reported unresolved symbol links"
            exit 1
          fi
